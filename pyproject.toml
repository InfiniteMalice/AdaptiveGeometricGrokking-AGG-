[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-geometric-grokking"
version = "0.1.0"
description = "Evidence-led consolidation, geometry, and compression experiments for grokking"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
geometry = ["geoopt>=0.5.1", "scipy>=1.11"]
topology = ["ripser>=0.6.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agg = "agg.experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
